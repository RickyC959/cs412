{% extends 'dadjokes/base.html' %} {% block content %}
<h1>All Dad Jokes</h1>
<ul>
  {% for joke in jokes %}
  <li>
    <a href="{% url 'joke_detail' joke.pk %}">{{ joke.text }}</a>
    — {{ joke.contributor }} ({{ joke.timestamp }})
  </li>
  {% empty %}
  <li>No jokes yet.</li>
  {% endfor %}
</ul>
{% endblock %}
