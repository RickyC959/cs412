{%load static%}
<html>
  <head>
    <title>Mini Insta</title>
    <link rel="stylesheet" href="{% static 'mini_insta.css' %}" />
  </head>

  <body>
    <header>
      <h1>Mini Insta</h1>
    </header>

    {% block content %} {% endblock %}
    
  </body>

  <footer>
    <ul class="footer-links">
      {% if profile %}
      <li><a href="{% url 'show_feed' profile.pk %}">Home</a></li>
      <li><a href="{% url 'create_post' profile.pk%}">Create New Post</a></li>
      {% endif %}
      <li><a href="{% url 'show_all_profiles' %}">Profiles</a></li>
    </ul>
  </footer>
</html>
