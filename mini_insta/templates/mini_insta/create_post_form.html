{% extends 'mini_insta/base.html'%} {% block content%}
<div class="form">
<h1>Create New Post</h1>
<form action="{% url 'create_post' profile.pk %}" method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <table>
    {{form.as_table}}
  
  <label for="image_uploads">Upload Image:</label>
  <input type="file" name="image_uploads" id="image_uploads" attribute="multiple">
</table>
  <input type="submit" name="submit" value="submit" />
  <a href="{% url 'show_profile' profile.pk %}">Cancel</a>
</form>
</div>
{%endblock%}
