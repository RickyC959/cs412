{% extends 'mini_insta/base.html'%} {% block content%}
<div class="form">
    <h1> Login to your account </h1>
    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        {{form.as_table}}
        <input class="btn btn-primary" type="submit" value="Login" style="margin-bottom: 20px">
        

        {% if request.GET.next %}
        <input type="hidden" name="next" value="{{request.GET.next}}">
        {% else %}
        <input type="hidden" name="next" value="{% url 'show_profile'%}">
        {% endif %}
    </form>

    <hr>
    Dont have an account? 
    <a class="btn btn-primary" href="{% url 'create_profile' %}" > Register Here</a>
</div>
{% endblock %}
