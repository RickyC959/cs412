{% extends 'mini_insta/base.html'%} {% block content%}
<div class="form">
  <h1>Update your profile</h1>
  <form action="{% url 'update_profile' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <table>
      {{form.as_table}}
      <tr>
        <th><label for="image_uploads">Upload Image:</label></th>
        <td><input type="file" name="image_uploads" id="image_uploads" attribute="multiple"></td>
      </tr>
    </table>
    <input class="btn btn-primary" type="submit" name="submit" value="submit" />
    <a class="btn btn-secondary" href="{% url 'show_profile' %}">Cancel</a>
  </form>
</div>
{%endblock%}
