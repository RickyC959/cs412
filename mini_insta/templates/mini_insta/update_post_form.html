{% extends 'mini_insta/base.html'%} {% block content%}
<div class="form">
<h1>Update post</h1>
<form action="{% url 'update_post' post.pk %}" method="POST" enctype="multipart/form-data">
  {% csrf_token %}
    <table>
    {{form.as_table}}
    </table>
  <input type="submit" name="submit" value="submit" />
  <a href="{% url 'show_post' post.pk %}">Cancel</a>
</form>
</div>
{%endblock%}
