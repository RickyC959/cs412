{% extends 'mini_insta/base.html'%} {% block content%}
<div class="form">
  <h1>Delete Post</h1>
  
  <h3>Are you sure you would like to delete this post?</h3>
  <p>{{post}}</p>
 
  <form method='POST'>
    {% csrf_token %}
    <input class="btn btn-danger" type='submit' value="Delete">
  </form>

  <form action="{% url 'post' post.pk %}" method='GET' >
    {% csrf_token %}
    <input class="btn btn-secondary" type='submit' value="Cancel">
  </form>
</div>
{% endblock %}
