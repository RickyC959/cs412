{% extends 'mini_insta/base.html'%} {% block content%}
<div class="form">
    <h1> You have Successfully logged out </h1>

    <p>click here to log back in</p>

    <form action="{% url 'login' %}" method='GET' >
        {% csrf_token %}
        <input class="btn btn-secondary" type='submit' value="Login">
    </form>

    <hr>
    Want to make a new account? <br>
    <a class="btn btn-primary" href="{% url 'register' %}" style=" width: 140px;"> Register Here</a>
</div>
{% endblock %}
