{% extends 'mini_insta/base.html'%} {% block content%}
<div class="form">
  <h1>Create New Profile</h1>
  <form action="{% url 'create_profile' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <h3>Account </h3>
    <table>
      {{user_form.as_table}}
    </table>
    <h3>Profile </h3>
    <table>
        {{form.as_table}}
    </table>
    <input class="btn btn-primary" type="submit" name="submit" value="Create Profile" />
    <a class="btn btn-secondary" href="{% url '' %}">Cancel</a>
  </form>
</div>
{%endblock%}
