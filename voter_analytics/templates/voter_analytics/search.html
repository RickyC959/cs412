<h1>Search Form</h1>

<table>
<form method="GET">

    <tr>
        <th>Party:</th>
        <td>
            <select name="party_affiliation">
                <option value="">Any</option>
                {% for p in parties %}
                    <option value="{{ p }}" {% if request.GET.party_affiliation == p %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
        </td>
    </tr>

    <tr>
        <th>Minimum Date of Birth (Year):</th>
        <td>
            <select name="min_dob">
                <option value="">Any</option>
                {% for y in years %}
                    <option value="{{ y }}" {% if request.GET.min_dob == y|stringformat:"d" %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </td>
    </tr>

    <tr>
        <th>Maximum Date of Birth (Year):</th>
        <td>
            <select name="max_dob">
                <option value="">Any</option>
                {% for y in years %}
                    <option value="{{ y }}" {% if request.GET.max_dob == y|stringformat:"d" %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </td>
    </tr>

    <tr>
        <th>Voter Score:</th>
        <td>
            <select name="voter_score">
                <option value="">Any</option>
                {% for s in scores %}
                    <option value="{{ s }}" {% if request.GET.voter_score == s|stringformat:"d" %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </td>
    </tr>

    <tr>
        <th>Voted in:</th>
        <td>
            <input type="checkbox" name="v20state" {% if request.GET.v20state %}checked{% endif %}> 2020 State
            <input type="checkbox" name="v21town" {% if request.GET.v21town %}checked{% endif %}> 2021 Town
            <input type="checkbox" name="v21primary" {% if request.GET.v21primary %}checked{% endif %}> 2021 Primary
            <input type="checkbox" name="v22general" {% if request.GET.v22general %}checked{% endif %}> 2022 General
            <input type="checkbox" name="v23town" {% if request.GET.v23town %}checked{% endif %}> 2023 Town
        </td>
    </tr>

    <tr>
        <td><input type="submit" value="Filter"></td>
        <td></td>
    </tr>

</form>
</table>
